name: Validar PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Verificar (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Instalar dependências
        run: npm ci --engine-strict
      - name: Verificar e compilar
        run: npm run verify
      - name: Conferir artefatos
        run: |
          test -s dist/index.html
          test -s dist/.htaccess
          test -s dist/blog/index.html
          test -s dist/admin/index.html
          test -s dist/admin/config.yml
          test -s dist/admin/sveltia-cms.js
